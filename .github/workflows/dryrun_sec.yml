name: TEMPORARY cross-check dry run (branch only)
on:
  push:
    branches: [crosscheck-fixes]
    paths: [dryrun_sec.py, .github/workflows/dryrun_sec.yml]
permissions:
  contents: write
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install edgartools==5.62.0 pandas==2.2.3 requests==2.33.1
      - env:
          SEC_IDENTITY_EMAIL: ${{ secrets.SEC_IDENTITY_EMAIL }}
        run: python dryrun_sec.py APTV TNC SMP SPCX SN NGVT TSLA NKE NOK BB RLX MNST RTX LLY RPM OGE WIT IMXI SHOE RES HOPE MU NAT NFG DHT
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dryrun_sec.json
          git commit -m "dry run results [skip ci]"
          git push
