name: Recession history test

# Run by hand. Picks the danger lines on 1968-1999, judges them on 2000-today,
# and saves recession/results/RESULTS.md.

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: recession
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python backtest.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Recession history test results [skip ci]"
          git pull --rebase && git push
      - name: Tell phone if it failed
        if: failure() || cancelled()
        run: >
          curl -s -H "Title: Recession history test FAILED" -H "Priority: 4" -H "Tags: x"
          -d "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" > /dev/null
