name: Cheap Options Scan

on:
  schedule:
    - cron: "31 19 * * 1-5"   # 19:31 UTC = 3:31 PM New York in summer time, 2:31 PM in winter. Runs DURING market hours on purpose: Yahoo often shows a zero bid/ask after the close.
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send a test ping even if nothing is cheap"
        type: boolean
        default: false

concurrency:
  group: packet-commit
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.33.1 yfinance==1.7.0 pandas==2.2.3 numpy==2.1.3

      - name: Run screen
        env:
          TEST_PING: ${{ github.event.inputs.test_ping == 'true' && '1' || '0' }}
        run: python cheap_options.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screens/cheap_options.md screens/iv_history.csv screens/cheap_options_alerts.csv
          git commit -m "scan: cheap options results" || echo "No changes"
          git pull --rebase origin main
          git push

      - name: Notify ntfy
        if: hashFiles('ntfy_message.txt') != ''
        run: |
          curl -d "$(cat ntfy_message.txt)" \
               -H "Title: Cheap Options" \
               -H "Click: https://github.com/qanicuq/ticker-forensics-data/blob/main/screens/cheap_options.md" \
               "https://ntfy.sh/$NTFY_TOPIC"

      - name: Alert on failure
        if: failure()
        run: |
          curl -d "The Cheap Options Scan failed. Tap to see the error." \
               -H "Title: Cheap Options FAILED" \
               -H "Click: https://github.com/qanicuq/ticker-forensics-data/actions/workflows/cheap_options.yml" \
               "https://ntfy.sh/$NTFY_TOPIC"
