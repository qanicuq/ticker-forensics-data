name: Recession check

# Daily check of recession signals. Pushes only when something changes, plus a Monday summary.
# No schedule yet: run by hand until the owner approves switching it on.

on:
  workflow_dispatch:
    inputs:
      summary:
        description: "Send the summary push now"
        type: boolean
        default: false

concurrency:
  group: recession-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: recession
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python alert.py ${{ inputs.summary && '--summary' || '' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Recession check state [skip ci]"
          git pull --rebase && git push
      - name: Tell phone if it failed
        if: failure() || cancelled()
        run: >
          curl -s -H "Title: Recession check FAILED" -H "Priority: 4" -H "Tags: x"
          -d "The bot could not check today, so silence is NOT all clear. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" > /dev/null
